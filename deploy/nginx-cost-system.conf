# 采购成本核价系统 Nginx 反向代理配置
# 有公网服务器 + 域名时使用；静态文件由 WhiteNoise 托管，无需 alias。
#
# 首次签发证书：
#   sudo certbot --nginx -d cost.example.com
# 然后把下面 listen 80 的 server 块交给 certbot 改写，或手动启用 443 配置。

upstream cost_system {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cost.example.com;

    # certbot 的 HTTP-01 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cost.example.com;

    ssl_certificate     /etc/letsencrypt/live/cost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cost.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://cost_system;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }
}
